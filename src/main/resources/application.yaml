spring:
  application:
    name: gestao-producao
  datasource:
    url: ${DB_URL}
    username: ${APP_RUNTIME_USER}
    password: ${APP_RUNTIME_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${MIGRATION_DB_USER}
    password: ${MIGRATION_DB_PASSWORD}
    schemas:
      - platform
      - operations
    default-schema: platform
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
supabase:
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
platform:
  bootstrap:
    owner-subject: ${PLATFORM_BOOTSTRAP_OWNER_SUBJECT:}
  invitation:
    base-url: ${PLATFORM_INVITATION_BASE_URL}
    delivery:
      enabled: ${PLATFORM_INVITATION_DELIVERY_ENABLED:false}
      sendgrid:
        api-key: ${PLATFORM_INVITATION_DELIVERY_SENDGRID_API_KEY:}
        from-email: ${PLATFORM_INVITATION_DELIVERY_SENDGRID_FROM_EMAIL:}
